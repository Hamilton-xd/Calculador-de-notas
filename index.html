<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas con Vue y Bootstrap</title>
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Vue.js 3 via CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-light">
    <div id="app" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0">Calculadora de Promedio</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted text-center mb-4">Ingresa tus calificaciones para calcular el ponderado final.</p>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Bloque 1 (20%)</label>
                            <input type="number" class="form-control" v-model="notas.bloque1" min="0" max="10" step="0.1" placeholder="Ej. 8.5">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Bloque 2 (20%)</label>
                            <input type="number" class="form-control" v-model="notas.bloque2" min="0" max="10" step="0.1" placeholder="Ej. 7.0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Bloque 3 (20%)</label>
                            <input type="number" class="form-control" v-model="notas.bloque3" min="0" max="10" step="0.1" placeholder="Ej. 9.2">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Proyecto Final (40%)</label>
                            <input type="number" class="form-control" v-model="notas.proyecto" min="0" max="10" step="0.1" placeholder="Ej. 8.0">
                        </div>
                        
                        <button class="btn btn-success w-100 fw-bold py-2" @click="calcularPromedio">
                            Calcular Promedio Final
                        </button>
                        
                        <div v-if="promedio !== null" class="mt-4 alert alert-info text-center shadow-sm mb-0">
                            <h5 class="mb-0">Promedio Final: <strong>{{ promedio }}</strong></h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    notas: {
                        bloque1: null,
                        bloque2: null,
                        bloque3: null,
                        proyecto: null
                    },
                    promedio: null
                }
            },
            methods: {
                calcularPromedio() {
                    const b1 = parseFloat(this.notas.bloque1) || 0;
                    const b2 = parseFloat(this.notas.bloque2) || 0;
                    const b3 = parseFloat(this.notas.bloque3) || 0;
                    const pf = parseFloat(this.notas.proyecto) || 0;
                    
                    // Cálculo ponderado
                    const final = (b1 * 0.2) + (b2 * 0.2) + (b3 * 0.2) + (pf * 0.4);
                    this.promedio = final.toFixed(2);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
